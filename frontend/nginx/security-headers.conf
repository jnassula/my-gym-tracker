# Security headers for every response (HSTS is added by Caddy, which terminates TLS).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(self)" always;
# Enforced: only the app's own scripts run, whatever ends up in a page. blob: is for the PDF,
# which opens in a new tab, and the profile photo; inline styles are the charts' <style>. What
# a browser blocks it reports to the backend, which logs it (app/core/csp.py): look there when
# something stops working on a phone.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
# No other site gets a handle on the app's windows, or loads its files into its own pages.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
