# Serves the built app (PWA) and proxies the API on the same origin, so the refresh-token
# cookie stays first-party and there is no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 21m;   # PDFs up to 20 MB
        proxy_read_timeout 180s;    # reading a PDF with the LLM takes a while
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Hashed file names: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidated, or a new version would never reach installed apps.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Single-page app: every other path is index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
