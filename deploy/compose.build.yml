# Builds the images from this checkout instead of pulling them from GHCR: the production
# stack on your machine (see README.md, "Correr a stack de produção localmente").
#   docker compose -f deploy/compose.yml -f deploy/compose.build.yml up --build
services:
  backend:
    build:
      context: ../backend
      target: prod
      args:
        APP_RELEASE: ${IMAGE_TAG:?set in .env}
        # CI passes what deploy/version.sh prints; a local build may too.
        APP_VERSION: ${APP_VERSION:-dev}

  frontend:
    build:
      context: ../frontend
      target: prod
      args:
        APP_VERSION: ${APP_VERSION:-dev}
