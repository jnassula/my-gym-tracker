# Weekly dependency updates as pull requests; CI/CD tests each one. Minor and patch updates
# come grouped per app (one PR), majors one by one. Security updates come as soon as an
# advisory is published (turn on "Dependabot security updates" in the repository settings).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    groups:
      backend:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    groups:
      frontend:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    ignore:
      # A new Python goes with backend/.python-version (CI reads it), by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A new Node major goes with CI's node-version, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    ignore:
      # A Postgres major needs a dump and restore of the data volume, never a tag bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)
