# Every push and pull request: lint, types, tests and known vulnerabilities of both apps, then
# the production images are built, scanned and the whole production stack is started and checked
# (deploy/smoke-test.sh). On main the images are published to GHCR, with where they were built
# attested, and deployed (deploy.yml). Each build carries the version worked out from the commits
# since the last release (deploy/version.sh).
#
# Only `publish` can write to the registry, and only on main: every other job reads.
name: CI/CD

on:
  push:
    branches-ignore: ["dependabot/**"] # Dependabot's branches run as pull requests
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a branch's run; main's runs deploy, so they queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: mygymtracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym -d mygymtracker"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The tests create and use mygymtracker_test (tests/conftest.py).
      DATABASE_URL: postgresql+asyncpg://gym:gym@localhost:5432/mygymtracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python from .python-version)
        run: uv sync --locked
      - name: Known vulnerabilities in what production installs
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt" --quiet
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the major of frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Known vulnerabilities in what the app ships
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts

  lint:
    name: Scripts, workflows and Dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts
        run: shellcheck deploy/*.sh
      # The two linters run from their images, pinned by digest (bumped by hand).
      - name: Workflows
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Dockerfiles
        run: |
          for file in backend/Dockerfile frontend/Dockerfile; do
            docker run --rm --interactive \
              hadolint/hadolint@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199 \
              hadolint - < "$file"
          done

  images:
    name: Production images
    needs: [backend, frontend, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
    outputs:
      version: ${{ steps.build.outputs.version }}
      os_updates: ${{ steps.build.outputs.os_updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version comes from the history since the last release's tag.
          fetch-depth: 0
          fetch-tags: true
      - name: Work out the version
        id: build
        run: |
          sh deploy/version-test.sh
          version=$(sh deploy/version.sh)
          # The day: the images install the distribution's fixes published up to it.
          day=$(date -u +%F)
          { echo "APP_VERSION=$version"; echo "OS_UPDATES=$day"; } >> "$GITHUB_ENV"
          { echo "version=$version"; echo "os_updates=$day"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: prod
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}/backend:${{ env.IMAGE_TAG }}
          build-args: |
            APP_RELEASE=${{ env.IMAGE_TAG }}
            APP_VERSION=${{ env.APP_VERSION }}
            OS_UPDATES=${{ env.OS_UPDATES }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build the frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: prod
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            OS_UPDATES=${{ env.OS_UPDATES }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # A known vulnerability that has a fix, high or critical, stops the release: in the
      # system's packages (rebuilt with the day's fixes), Python's or the app's dependencies.
      # One with no fix for what we run is listed in .grype.yaml with its reason.
      - name: Scan the backend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REPOSITORY }}/backend:${{ env.IMAGE_TAG }}
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the frontend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Start the production stack
        working-directory: deploy
        run: |
          cat > .env <<EOF
          DOMAIN=localhost
          IMAGE_REPOSITORY=$IMAGE_REPOSITORY
          IMAGE_TAG=$IMAGE_TAG
          POSTGRES_USER=gym
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=mygymtracker
          S3_ACCESS_KEY=gym-s3
          S3_SECRET_KEY=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          SMTP_HOST=smtp.invalid
          EMAIL_FROM=myGymTracker <no-reply@example.com>
          VAPID_SUBJECT=mailto:ci@example.com
          DEMOS_AUTO_COPY=false
          EOF
          docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test
        working-directory: deploy
        env:
          CURL_OPTS: --insecure # Caddy's local CA for localhost
        run: |
          sh smoke-test.sh https://localhost "$IMAGE_TAG" "$APP_VERSION"
          # A real write through Caddy, nginx and the backend into Postgres: a sign-up (the
          # account then waits for its confirmation email, which goes nowhere here).
          curl --fail --silent --show-error --insecure --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"email":"smoke@example.com","password":"Smoke-test-2026","name":"Smoke"}' \
            https://localhost/api/auth/signup
          # Plain HTTP is redirected to HTTPS.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = 308
          # Backups work: the database dump and the stored files.
          docker compose run --rm --no-deps backup now
      - name: Logs of the failed stack
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 100

  publish:
    name: Publish the images
    needs: images
    # Only main's commits reach the registry: the one job that can write to it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # the attestations are signed with this run's identity
      attestations: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_VERSION: ${{ needs.images.outputs.version }}
      OS_UPDATES: ${{ needs.images.outputs.os_updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build as the images job, taken from the cache it filled (the layers it tested
      # and scanned), and pushed.
      - name: Push the backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}/backend:main
          build-args: |
            APP_RELEASE=${{ env.IMAGE_TAG }}
            APP_VERSION=${{ env.APP_VERSION }}
            OS_UPDATES=${{ env.OS_UPDATES }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=backend
      - name: Push the frontend image
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}/frontend:main
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            OS_UPDATES=${{ env.OS_UPDATES }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=frontend
      # Which commit and which run each image came from, signed and kept with the image:
      # `gh attestation verify oci://ghcr.io/<repo>/backend:<sha> --repo <repo>` checks it.
      - name: Attest the backend image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Attest the frontend image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails a pull request that adds a dependency with a known high-severity vulnerability.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  deploy:
    name: Deploy
    needs: publish
    # Only main, and only once the server is configured (deploy/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    permissions:
      contents: write # the deploy tags the version it put live
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
