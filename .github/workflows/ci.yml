# Every push and pull request: lint, types and tests of both apps, then the production images
# are built and the whole production stack is started and checked (deploy/smoke-test.sh).
# On main the images are published to GHCR and deployed (deploy.yml).
name: CI/CD

on:
  push:
    branches-ignore: ["dependabot/**"] # Dependabot's branches run as pull requests
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a branch's run; main's runs deploy, so they queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: mygymtracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym -d mygymtracker"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The tests create and use mygymtracker_test (tests/conftest.py).
      DATABASE_URL: postgresql+asyncpg://gym:gym@localhost:5432/mygymtracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python from .python-version)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the major of frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts

  images:
    name: Production images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: prod
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}/backend:${{ env.IMAGE_TAG }}
          build-args: APP_RELEASE=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build the frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: prod
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}/frontend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Start the production stack
        working-directory: deploy
        run: |
          cat > .env <<EOF
          DOMAIN=localhost
          IMAGE_REPOSITORY=$IMAGE_REPOSITORY
          IMAGE_TAG=$IMAGE_TAG
          POSTGRES_USER=gym
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=mygymtracker
          S3_ACCESS_KEY=gym-s3
          S3_SECRET_KEY=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          SMTP_HOST=smtp.invalid
          EMAIL_FROM=myGymTracker <no-reply@example.com>
          VAPID_SUBJECT=mailto:ci@example.com
          EOF
          docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test
        working-directory: deploy
        env:
          CURL_OPTS: --insecure # Caddy's local CA for localhost
        run: |
          sh smoke-test.sh https://localhost "$IMAGE_TAG"
          # A real write through Caddy, nginx and the backend into Postgres.
          curl --fail --silent --show-error --insecure --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"email":"smoke@example.com","password":"Smoke-test-2026","name":"Smoke"}' \
            https://localhost/api/auth/register
          # Plain HTTP is redirected to HTTPS.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = 308
          # Backups work: the database dump and the stored files.
          docker compose run --rm --no-deps backup now
      - name: Logs of the failed stack
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 100
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images
        if: env.PUBLISH == 'true'
        run: |
          for image in backend frontend; do
            docker tag "$IMAGE_REPOSITORY/$image:$IMAGE_TAG" "$IMAGE_REPOSITORY/$image:main"
            docker push "$IMAGE_REPOSITORY/$image:$IMAGE_TAG"
            docker push "$IMAGE_REPOSITORY/$image:main"
          done

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails a pull request that adds a dependency with a known high-severity vulnerability.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  deploy:
    name: Deploy
    needs: images
    # Only main, and only once the server is configured (deploy/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
